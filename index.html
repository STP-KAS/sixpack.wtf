<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sixpack.wtf</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #f4efe6; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .note { position: fixed; top: 12px; right: 12px; max-width: min(28rem, calc(100vw - 24px)); text-align: right; }
    button { font: 12px/1.2 Georgia, serif; color: #f4efe6; background: transparent; border: 1px solid rgba(244, 239, 230, 0.45); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
    p { margin: 8px 0 0; font: 13px/1.4 Georgia, serif; }
  </style>
</head>
<body>
  <video autoplay muted loop playsinline controls preload="auto">
    <source src="closed/screen.mp4" type="video/mp4">
  </video>
  <div class="note">
    <button type="button" id="disc" aria-expanded="false" aria-controls="disc-line">Disclaimer</button>
    <p id="disc-line" hidden>Programmable high frequency proof of work. Publicly available. Use at will. Monthly subscription cost, zero. Purchase license cost, zero. Other possible costs or charges: also zero.</p>
  </div>
  <script>
    var btn = document.getElementById("disc");
    var line = document.getElementById("disc-line");
    btn.addEventListener("click", function () {
      var open = line.hidden;
      line.hidden = !open;
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  </script>
</body>
</html>
